name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore LingoHub.sln
      - run: dotnet build LingoHub.sln -c Release --no-restore
      - run: dotnet test LingoHub.sln -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingohub-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lingohub-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        if: env.PUSH_IMAGES == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lingohub-ci-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUSH_IMAGES == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: LingoHub.Api
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: lingohub-web
          push: ${{ env.PUSH_IMAGES == 'true' }}
          build-args: NEXT_PUBLIC_API_URL=
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

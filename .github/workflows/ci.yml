name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore LingoHub.sln
      - run: dotnet build LingoHub.sln -c Release --no-restore
      - run: dotnet test LingoHub.sln -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingohub-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lingohub-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        if: env.PUSH_IMAGES == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lingohub-ci-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUSH_IMAGES == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: LingoHub.Api
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: lingohub-web
          push: ${{ env.PUSH_IMAGES == 'true' }}
          build-args: NEXT_PUBLIC_API_URL=
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry || 'local' }}/lingohub-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: i-0b9700118b770b791
      DEPLOY_COMMAND: unset AWS_SHARED_CREDENTIALS_FILE && export HOME=/root DOCKER_CONFIG=/root/.docker && cd /opt/lingohub && docker compose pull api web && docker compose up -d api web
      TIMEOUT_SECONDS: 900
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lingohub-deploy-${{ github.run_id }}

      - name: Send deploy command via SSM
        id: send
        run: |
          set -euo pipefail
          parameters=$(jq -nc --arg cmd "$DEPLOY_COMMAND" --arg timeout "$TIMEOUT_SECONDS" \
            '{commands: [$cmd], executionTimeout: [$timeout]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "LingoHub deploy ${GITHUB_SHA::7}" \
            --parameters "$parameters" \
            --query Command.CommandId --output text)
          echo "SSM command ID: $command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + TIMEOUT_SECONDS + 60))
          status=Pending
          while true; do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            if (( SECONDS > deadline )); then
              echo "::error::Timed out waiting for SSM command $COMMAND_ID (last status: $status)"
              exit 1
            fi
            echo "Status: $status"
            sleep 5
          done

          invocation() {
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "$1" --output text
          }
          echo "::group::Remote stdout"
          invocation StandardOutputContent
          echo "::endgroup::"
          echo "::group::Remote stderr"
          invocation StandardErrorContent
          echo "::endgroup::"

          if [[ "$status" != "Success" ]]; then
            echo "::error::Deploy failed: status $status, exit code $(invocation ResponseCode)"
            exit 1
          fi
          echo "Deploy succeeded"

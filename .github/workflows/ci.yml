name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore LingoHub.sln
      - run: dotnet build LingoHub.sln -c Release --no-restore
      - run: dotnet test LingoHub.sln -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingohub-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lingohub-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: LingoHub.Api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: lingohub-web
          push: false
          build-args: NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
